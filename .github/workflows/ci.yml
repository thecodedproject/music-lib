name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      # dist/ is committed, so the apps can install the library straight from a tag
      - name: Check dist/ is built from the source
        run: git diff --exit-code --stat -- dist && test -z "$(git status --porcelain -- dist)"
